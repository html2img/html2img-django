# Publishes to PyPI when a GitHub release is published.
#
# This uses PyPI Trusted Publishing (OIDC), so there is no API token to store.
# Configure it once at https://pypi.org/manage/project/html2img-django/settings/publishing/
# with:
#   Owner:            html2img
#   Repository:       html2img-django
#   Workflow name:    publish.yml
#   Environment name: pypi
#
# See PUBLISHING.md for the full walkthrough.

name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/html2img-django

    permissions:
      id-token: write # required for trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
