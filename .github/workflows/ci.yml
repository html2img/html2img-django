name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} - Django ${{ matrix.django }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django: ['4.2', '5.1', '5.2', '6.0', '6.1']
        exclude:
          # Django 4.2 supports Python 3.8 to 3.12.
          - { python: '3.13', django: '4.2' }
          - { python: '3.14', django: '4.2' }
          # Django 5.1 supports Python 3.10 to 3.13.
          - { python: '3.14', django: '5.1' }
          # Django 6.x requires Python 3.12 or newer.
          - { python: '3.10', django: '6.0' }
          - { python: '3.11', django: '6.0' }
          - { python: '3.10', django: '6.1' }
          - { python: '3.11', django: '6.1' }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install "django~=${{ matrix.django }}.0"

      - name: Run tests
        run: pytest

  quality:
    name: Lint and types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Check code style
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy

  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
